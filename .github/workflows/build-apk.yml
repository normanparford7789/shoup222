name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: |
          supabase link --project-ref "dmzmsgolisgcvbfaekby" --debug
        env:
          SUPABASE_ACCESS_TOKEN: "sbp_e34ba25a60ff4793a0ab065d26bea1b67f88db5c"

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy --project-ref "dmzmsgolisgcvbfaekby"
        env:
          SUPABASE_ACCESS_TOKEN: "sbp_e34ba25a60ff4793a0ab065d26bea1b67f88db5c"
